services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-imobiliaria}
      DATABASE_USERNAME: ${POSTGRES_USER:-imobiliaria}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      UPLOAD_DIR: ${UPLOAD_DIR:-./site-ap-uploads}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${UPLOAD_DIR:-./site-ap-uploads}
        target: /app/data/uploads

