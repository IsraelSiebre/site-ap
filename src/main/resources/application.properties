spring.application.name=andre-pacheco-imoveis
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/imobiliaria;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-part-count=200
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.upload-dir=${UPLOAD_DIR:./site-ap-uploads}
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.seed.enabled=${SEED_ENABLED:true}
