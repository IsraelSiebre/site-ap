<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head}"></head><body data-p="contato">
<div th:replace="~{fragments/site :: header}"></div>
<main><div class="pghead"><div class="wrap"><h1>Contato</h1><p id="sub">Fale com a gente</p></div></div>
<div class="wrap pg" id="pg"><div class="two"><div class="cts">
  <a class="ct" th:href="${view.wa(inst.whatsapp)}" target="_blank" rel="noopener">WhatsApp<b th:text="${view.phone(inst.whatsapp)}"></b></a>
  <a class="ct" th:href="${view.instagram(inst.instagram)}" target="_blank" rel="noopener">Instagram<b th:text="${inst.instagram}"></b></a>
  <div class="ct">Endereço<b><th:block th:replace="~{fragments/site :: map(${inst.endereco})}"/></b></div></div>
  <form class="fm" id="fm" th:attr="data-phone=${inst.whatsapp}"><h2>Envie uma mensagem</h2><div><label for="n">Nome</label><input id="n" required></div><div><label for="m">Mensagem</label><textarea id="m" rows="5" required></textarea></div><button class="go" type="submit">Enviar pelo WhatsApp</button></form>
</div></div></main>
<div th:replace="~{fragments/site :: footer}"></div><th:block th:replace="~{fragments/site :: scripts}"/>
</body></html>
